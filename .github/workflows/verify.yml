name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test verify

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test serial capture contract
        shell: pwsh
        run: ./tools/test-capture-eaidk-boot.ps1
      - name: Test serial console contract
        shell: pwsh
        run: ./tools/test-serial-console.ps1
      - name: Test U-Boot region writer
        shell: pwsh
        run: ./tools/test-write-uboot-proper-to-tf.ps1
