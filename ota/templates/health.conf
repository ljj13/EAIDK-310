# eaidk-ota health configuration template (P3.5)
# Values below encode the currently observed recovery timings; the tool reads
# them as CLI defaults in a future revision.  Not auto-applied.

[grace]
# kernel + systemd settle window after boot before CRITICAL checks run
boot_seconds = 120
# transient campus/proxy/Tailscale failures must not trigger rollback loops
network_seconds = 600
# bounded retries for REMOTE_HEALTH probes
network_retries = 3
network_retry_wait_seconds = 60

[subsystems]
# expected stable values on this board
zram_algorithm = lz4
portal_url = http://net.szu.edu.cn/
gateway_v4 = 172.31.180.33
proxy_endpoint = 127.0.0.1:7890
tailscale_peer = 100.72.239.86
